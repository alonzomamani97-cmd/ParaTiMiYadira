<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Para Yadira ✨</title><style>body{background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; background-image: radial-gradient(circle, #4e342e 0%, #1a1a1a 100%);}.card-mensaje{background: #fff1f2; padding: 40px; border-radius: 30px; text-align: center; color: #5d4037; position: absolute; z-index: 100; width: 85%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transition: all 0.5s ease;}.btn-principal{background: #d81b60; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 25px; box-shadow: 0 5px 15px rgba(216, 27, 96, 0.4); transition: transform 0.2s;}.btn-principal:hover{transform: scale(1.05); background: #ad1457;}.player-card{display: none; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 30px; border-radius: 40px; align-items: center; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.2); width: 85%; max-width: 450px; position: relative; z-index: 5; box-shadow: 0 25px 45px rgba(0,0,0,0.2);}.album-art{width: 280px; height: 280px; border-radius: 25px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border: 3px solid rgba(255,255,255,0.1);}.album-art img{width: 100%; height: 100%; object-fit: cover;}#lyrics-container{font-size: 24px; font-weight: bold; min-height: 80px; color: #ffccbc; margin-bottom: 25px; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); transition: all 0.3s ease;}audio{width: 100%; height: 45px; filter: invert(100%) hue-rotate(180deg) brightness(1.5);}.snoopy-fly{position: fixed; width: 80px; pointer-events: none; z-index: 1; animation: floatUp var(--duration) linear infinite;}@keyframes floatUp { 0% { transform: translateY(110vh) translateX(var(--startX)) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-20vh) translateX(calc(var(--startX) + 15vw)) rotate(360deg); opacity: 0; } }</style></head><body><div id='ventana-1' class='card-mensaje'><h2>✨ PARA TI YADIRA ✨</h2><p>He preparado algo especial para ti... 😇</p><button class='btn-principal' onclick='iniciarTodo()'>¡VER SORPRESA! 💖</button></div><div class='player-card' id='reproductor'><div class='album-art'><img src='portada.jpg' onerror="this.src='https://via.placeholder.com/280?text=Nuestra+Foto'"></div><div id='lyrics-container'>🎶</div><audio id='player' controls><source src='musica.mp3' type='audio/mpeg'></audio></div><script>const sincronizacion = [{t: 0, m: "Dime, ¿dónde estabas?"}, {t: 4, m: "Le di la vuelta al mundo..."},{t: 8, m: "Y ahora que te besaba"}, {t: 12, m: "La piel se hizo fuego"},{t: 16, m: "Hoy estás en mi almohada"}, {t: 20, m: "Con poca ropa y bien mojada"},{t: 24, m: "Las miradas nunca mienten"}, {t: 28, m: "Yo te siento, tú me siente'"},{t: 32, m: "A ella le gusta que la toque"}, {t: 36, m: "Era obvio, baby"},{t: 40, m: "Te amo en todas las poses"}, {t: 44, m: "Con tan solo el roce"}];function iniciarTodo() {  document.getElementById('ventana-1').style.opacity='0';  setTimeout(() => {    document.getElementById('ventana-1').style.display='none';    const reproductor = document.getElementById('reproductor');    reproductor.style.display='flex';    const audio = document.getElementById('player');    audio.play().catch(e => console.log('El navegador requiere interacción manual'));    setInterval(crearSnoopy, 800);  }, 500);}function crearSnoopy() {  const s = document.createElement('img'); s.src = 'snoopy.png'; s.className = 'snoopy-fly';  s.style.setProperty('--startX', (Math.random() * 95) + 'vw');  s.style.setProperty('--duration', (Math.random() * 3 + 4) + 's');  document.body.appendChild(s); setTimeout(() => s.remove(), 7000);}const player = document.getElementById('player'); const container = document.getElementById('lyrics-container');player.ontimeupdate = () => {  const ct = player.currentTime;  let textoActual = "🎶";  for (let i = 0; i < sincronizacion.length; i++) {    if (ct >= sincronizacion[i].t) { textoActual = sincronizacion[i].m; }  }  if(container.innerText !== textoActual) { container.innerText = textoActual; }};</script></body></html>
